name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (specs/release-workflow.md there). This file only names KS JaiPlayer's platforms.
#
#   Tag push vMAJOR.MINOR.PATCH   Builds the signed APK (phone + Google TV), the macOS dmg and the
#                                 Windows msi, then publishes the GitHub Release.
#   Manual run (rehearsal)        Builds and checks everything for the version given; never publishes.

on:
  push:
    # vX.Y.Z releases every platform; android-, google-tv-, mac-, windows-vX.Y.Z only that one.
    tags: ["v*.*.*", "*-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z. Builds everything, releases nothing."
        required: true
        type: string
      platform:
        description: "Platform to rehearse: all, android, google-tv, mac or windows."
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # @dev while dev tries ks-utility's unreleased dev (DEV builds only; ks-suite-check refuses
    # @dev in a tag release). Before the next production release: pin the newest tag, back to @main.
    uses: kumasumit/ks-utility/.github/workflows/kotlin-app-release.yml@dev
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      platform: ${{ inputs.platform || 'all' }}
      app-name: ks-jaiplayer
      display-name: KS JaiPlayer
      android-module: ":mobile:android"
      tv-module: ":tv:google-tv"
      play-build-type: "play"
      mac-module: ":desktop:mac"
      mac-intel: true
      windows-module: ":desktop:windows"
      test-tasks: ":shared:desktopTest :shared:check"
      desktop-test-tasks: ":shared:desktopTest"
    secrets: inherit
